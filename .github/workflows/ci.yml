name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test with coverage
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory coverage

      - name: Enforce 70% line coverage on Core and Infrastructure
        run: python3 .github/scripts/check-coverage.py coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Verify C# formatting
        run: dotnet format InventorySync.sln --verify-no-changes --verbosity diagnostic

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS tooling
        run: npm ci

      - name: Lint admin UI JavaScript
        run: npm run lint

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile -t inventorysync-api:ci .

      - name: Build MockErp image
        run: docker build -f src/MockErp/Dockerfile -t inventorysync-mock-erp:ci .
